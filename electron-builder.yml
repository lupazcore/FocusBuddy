appId: com.lupazcore.focusbuddy
productName: Focus Buddy
copyright: "Copyright © Lupaz"
directories:
  output: release
  buildResources: assets/icons
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets/sounds
    to: sounds
    filter:
      - "**/*"
      - "!LICENSES.md"
      - "!README.md"
asar: true

win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: "${productName}-${version}-portable-${arch}.${ext}"

mac:
  icon: assets/icons/icon.icns
  category: public.app-category.healthcare-fitness
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  icon: assets/icons/png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

publish:
  provider: github
  releaseType: release
